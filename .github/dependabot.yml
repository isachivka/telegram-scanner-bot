version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # typescript-eslint has to catch up before TypeScript majors can land.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the current Node LTS line on purpose.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
